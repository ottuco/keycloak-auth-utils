name: Tests with tox

on:
  pull_request:
    # Drafts are skipped (job-level `if` below); ready_for_review runs the checks
    # when the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a PR cancels its superseded run.
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox -U
    # Only this job's interpreter is installed, so run only its environments. tox
    # used to skip the others; since 4.65 a missing interpreter fails the run.
    # An environment with no pyXY factor in its name is selected by no job.
    - name: Run Tests
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        tox -r -vvv -f "py${PYTHON_VERSION//./}"
