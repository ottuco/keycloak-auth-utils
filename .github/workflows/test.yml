name: Tests with tox

on:
  pull_request:

# A new push to a PR cancels its superseded run.
concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox -U
    # Only this job's interpreter is installed, so run only its environments. tox
    # used to skip the others; since 4.65 a missing interpreter fails the run.
    # An environment with no pyXY factor in its name is selected by no job.
    - name: Run Tests
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        tox -r -vvv -f "py${PYTHON_VERSION//./}"
